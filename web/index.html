<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PokerGym · 夜场</title>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <div class="room">
    <header class="mast">
      <div class="mast-brand">
        <em>夜场</em>
        <strong>PokerGym</strong>
      </div>
      <p class="mast-meta" id="mast-meta">开局中</p>
      <p class="llm-pill" id="llm-pill">LLM</p>
      <label class="mode">
        模式
        <select id="mode">
          <option value="train">训练 · 对手读得快</option>
          <option value="realism">拟真 · 对手读得慢</option>
        </select>
      </label>
      <button type="button" class="ghost" id="btn-new">换一桌</button>
    </header>

    <aside class="tape" aria-label="记录">
      <div class="hero-hud" id="hero-hud"></div>
      <div class="tabs" role="tablist">
        <button type="button" class="on" data-tab="live" id="tab-live">本手</button>
        <button type="button" data-tab="hist" id="tab-hist">历史</button>
      </div>
      <ol id="log"></ol>
      <ol id="hist" hidden></ol>
    </aside>

    <main class="stage">
      <div class="lamp" aria-hidden="true"></div>
      <div class="table" id="table">
        <div class="rail"></div>
        <div class="felt-in">
          <div class="pot" id="pot">
            <span class="pot-k">底池</span>
            <span class="pot-v" id="pot-v">—</span>
          </div>
          <div class="board" id="board"></div>
          <p class="street" id="street"></p>
        </div>
        <div id="seats"></div>
      </div>
    </main>

    <aside class="coach" id="coach" aria-label="教练">
      <h2>这口该怎么打</h2>
      <p class="eq-big" id="eq-big">—</p>
      <p class="advice" id="advice">发牌后给出位置建议</p>
      <dl id="coach-dl"></dl>
      <p class="tags" id="tags"></p>
      <h2 id="chart-title">范围图</h2>
      <div class="gto" id="gto-grid" aria-label="GTO 范围"></div>
      <p class="gto-cap">上三角同花 · 对角对子 · 下三角杂色。亮格=该打，金框=你的手牌。</p>
    </aside>

    <footer class="tray" id="tray">
      <p class="hint" id="hint">发牌后轮到你再动</p>
      <div class="tray-row">
        <div class="legal" id="legal"></div>
        <div class="sizes" id="sizes" hidden></div>
      </div>
      <div class="custom-bet" id="betbox" hidden>
        <label for="bet-amount">自定义加到</label>
        <button type="button" id="bet-minus">−</button>
        <input id="bet-amount" type="number" step="0.5" inputmode="decimal" />
        <button type="button" id="bet-plus">+</button>
        <span class="bet-read" id="bet-read"></span>
        <button type="button" id="bet-confirm">打出这个数</button>
      </div>
    </footer>
  </div>

  <section class="slip" id="slip" hidden>
    <h2>这手完了</h2>
    <p id="slip-review"></p>
    <ul id="winners"></ul>
    <button type="button" class="primary" id="btn-next">下一手</button>
  </section>

  <script src="/js/api.js"></script>
  <script src="/js/render.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
